const CITATION_PATTERNS = [
  /Pasal\s+\d+[a-zA-Z]?\s*(?:ayat\s*\(\d+\))?\s*(?:huruf\s+[a-z])?\s+(?:Undang-Undang(?:\s+Nomor|\s+No\.?)?\s*\d+\s+Tahun\s+\d{4}|Peraturan\s+Pemerintah(?:\s+Nomor|\s+No\.?)?\s*\d+\s+Tahun\s+\d{4}|Kompilasi\s+Hukum\s+Islam)/gi,
  /(?:Undang-Undang|UU)\s*(?:Nomor|No\.?)\s*\d+\s+Tahun\s+\d{4}/gi,
  /Peraturan\s+Pemerintah\s*(?:Nomor|No\.?)?\s*\d+\s+Tahun\s+\d{4}/gi,
  /(?:Peraturan\s+Mahkamah\s+Agung|Perma)\s*(?:Nomor|No\.?)?\s*\d+\s+Tahun\s+\d{4}/gi,
  /(?:Surat\s+Edaran\s+Mahkamah\s+Agung|SEMA)\s*(?:Nomor|No\.?)?\s*\d+\s+Tahun\s+\d{4}/gi,
  /Pasal\s+\d+[a-zA-Z]?\s*(?:ayat\s*\(\d+\))?\s+(?:Kitab\s+Undang-Undang\s+Hukum\s+(?:Perdata|Pidana)|KUHPerdata|KUHP|KUHAP|HIR|RBg)/gi,
];

function extractCitations(text) {
  const found = new Set();
  CITATION_PATTERNS.forEach((re) => {
    const matches = text.match(re) || [];
    matches.forEach((m) => found.add(m.replace(/\s+/g, " ").trim()));
  });
  return [...found];
}

function normalizeCitation(s) {
  return s
    .toLowerCase()
    .replace(/nomor/g, "no")
    .replace(/no\./g, "no")
    .replace(/[.,;]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}

function citationMatchesReference(citation, ref) {
  const c = normalizeCitation(citation);
  const t = normalizeCitation(ref.title || "");
  if (!t) return false;
  return c.includes(t) || t.includes(c) || (c.split(" ").filter((w) => w.length > 2).every((w) => t.includes(w)));
}

function inferPetitionWord(c) {
  const permohonanSubtypes = ["Cerai Talak", "Isbat Nikah", "Dispensasi Kawin", "Perubahan Nama (Buku Nikah)"];
  if (c.legalArea === "Keluarga" && c.familySubtype) {
    return permohonanSubtypes.includes(c.familySubtype) ? "permohonan" : "gugatan";
  }
  return "gugatan";
}

function waitForAuthState() {
  return new Promise((resolve) => {
    const unsub = firebase.auth().onAuthStateChanged((user) => {
      unsub();
      resolve(user);
    });
  });
}

function useStore(key, initial) {
  const [data, setData] = useState(initial);
  const [synced, setSynced] = useState(false);

  useEffect(() => {
    let unsubSnap = () => {};
    let cancelled = false;
    if (!fbReady) { setSynced(true); return; }
    waitForAuthState()
      .then((user) => {
        if (cancelled || !fbDb || !user) { setSynced(true); return; }
        const ref = fbDb.collection("trunojoyo_data").doc(key);
        unsubSnap = ref.onSnapshot(
          (snap) => {
            if (snap.exists && snap.data().value !== undefined) {
              setData(snap.data().value);
            }
            setSynced(true);
          },
          (err) => { console.error("Sync error (" + key + "):", err); setSynced(true); }
        );
      })
      .catch((err) => { console.error(err); setSynced(true); });
    return () => { cancelled = true; unsubSnap(); };
  }, [key]);

  const update = (updater) => {
    setData((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      if (fbDb && firebase.auth().currentUser) {
        fbDb.collection("trunojoyo_data").doc(key).set({ value: next, updatedAt: Date.now() }).catch((err) => console.error("Gagal menyimpan (" + key + "):", err));
      }
      return next;
    });
  };

  return [data, update, synced];
}

function loadPdfJs() {
  if (window.pdfjsLib) {
    if (!window.pdfjsLib.GlobalWorkerOptions.workerSrc) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
    return Promise.resolve(window.pdfjsLib);
  }
  if (window.__pdfjsLoading) return window.__pdfjsLoading;
  window.__pdfjsLoading = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      resolve(window.pdfjsLib);
    };
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return window.__pdfjsLoading;
}

// Kompresi PDF di sisi browser: tiap halaman dirender ulang ke gambar JPEG beresolusi sedang
// lalu disusun ulang jadi PDF baru — ini biasanya memangkas ukuran file scan/foto secara drastis.
// Kalau hasilnya TIDAK lebih kecil (mis. PDF teks murni yang memang sudah ringkas), file asli
// dipakai apa adanya supaya kualitas tidak dikorbankan sia-sia.
// Trade-off yang perlu diketahui: karena halaman dirender jadi gambar, teks di PDF hasil kompresi
// TIDAK BISA di-select/di-copy/dicari lagi (beda dari PDF aslinya kalau itu PDF teks/hasil OCR).
async function compressPdfFile(file, onProgress) {
  try {
    const pdfjsLib = await loadPdfJs();
    const originalBytes = new Uint8Array(await file.arrayBuffer());
    const pdf = await pdfjsLib.getDocument({ data: originalBytes }).promise;
    if (!window.jspdf) throw new Error("Pustaka kompresi (jsPDF) belum termuat.");
    const { jsPDF } = window.jspdf;
    const targetDPI = 130; // cukup jelas untuk dibaca/dicetak, tapi jauh lebih ringan dari scan asli (biasanya 300 DPI+)
    const scale = targetDPI / 72;
    let outDoc = null;
    for (let i = 1; i <= pdf.numPages; i++) {
      if (onProgress) onProgress(i, pdf.numPages);
      const page = await pdf.getPage(i);
      const baseViewport = page.getViewport({ scale: 1 });
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(viewport.width);
      canvas.height = Math.round(viewport.height);
      const ctx = canvas.getContext("2d");
      await page.render({ canvasContext: ctx, viewport }).promise;
      const imgData = canvas.toDataURL("image/jpeg", 0.62);
      const orientation = baseViewport.width > baseViewport.height ? "l" : "p";
      if (!outDoc) {
        outDoc = new jsPDF({ orientation, unit: "pt", format: [baseViewport.width, baseViewport.height], compress: true });
      } else {
        outDoc.addPage([baseViewport.width, baseViewport.height], orientation);
      }
      outDoc.addImage(imgData, "JPEG", 0, 0, baseViewport.width, baseViewport.height);
      canvas.width = 0; canvas.height = 0; // bantu garbage collector di dokumen banyak halaman
    }
    const compressedBlob = outDoc.output("blob");
    if (compressedBlob.size > 0 && compressedBlob.size < file.size * 0.9) {
      return { blob: compressedBlob, compressed: true, originalSize: file.size, finalSize: compressedBlob.size };
    }
    return { blob: file, compressed: false, originalSize: file.size, finalSize: file.size };
  } catch (err) {
    console.error("Kompresi PDF gagal, memakai file asli:", err);
    return { blob: file, compressed: false, originalSize: file.size, finalSize: file.size, error: err.message };
  }
}

function fmtBytes(n) {
  if (!n && n !== 0) return "-";
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(0) + " KB";
  return (n / (1024 * 1024)).toFixed(1) + " MB";
}


function PdfViewerModal({ info, onClose, onPageChange }) {
  const canvasRef = React.useRef(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    setError(null);
    (async () => {
      try {
        const pdfjsLib = await loadPdfJs();
        const binary = atob(info.pdfData);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const pdf = await pdfjsLib.getDocument({ data: bytes }).promise;
        const page = await pdf.getPage(info.page);
        const viewport = page.getViewport({ scale: 1.4 });
        const canvas = canvasRef.current;
        if (!canvas) return;
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        const ctx = canvas.getContext("2d");
        await page.render({ canvasContext: ctx, viewport }).promise;
        if (!cancelled) setLoading(false);
      } catch (e) {
        if (!cancelled) { setError("Gagal menampilkan halaman PDF."); setLoading(false); }
      }
    })();
    return () => { cancelled = true; };
  }, [info.pdfData, info.page]);

  return (
    <Modal title={`${info.title} — Halaman ${info.page}`} onClose={onClose}>
      <div className="sans">
        {loading && <p className="text-sm text-[#6B6252] mb-2">Memuat halaman…</p>}
        {error && <p className="text-sm text-[#7A2331] mb-2">{error}</p>}
        <div className="overflow-auto max-h-[65vh] border border-[#D9CFB8] bg-[#F7F4EC] flex justify-center">
          <canvas ref={canvasRef} style={{ maxWidth: "100%", height: "auto" }} />
        </div>
        {info.numPages > 1 && (
          <div className="flex items-center justify-between mt-3">
            <button disabled={info.page <= 1} onClick={() => onPageChange(info.page - 1)} className={`px-3 py-1.5 text-xs disabled:opacity-40 ${btnOutline}`}>← Sebelumnya</button>
            <span className="text-xs text-[#6B6252]">Halaman {info.page} / {info.numPages}</span>
            <button disabled={info.page >= info.numPages} onClick={() => onPageChange(info.page + 1)} className={`px-3 py-1.5 text-xs disabled:opacity-40 ${btnOutline}`}>Selanjutnya →</button>
          </div>
        )}
        {info.matchPages?.length > 1 && (() => {
          const idx = info.matchPages.indexOf(info.page);
          const prevMatch = idx > 0 ? info.matchPages[idx - 1] : null;
          const nextMatch = idx >= 0 && idx < info.matchPages.length - 1 ? info.matchPages[idx + 1] : null;
          return (
            <div className="flex items-center justify-between mt-2 pt-2 border-t border-[#D9CFB8]">
              <button disabled={!prevMatch} onClick={() => onPageChange(prevMatch)} className={`px-3 py-1.5 text-xs disabled:opacity-40 ${btnPrimary}`}>◀ Kecocokan Sebelumnya</button>
              <span className="text-xs text-[#A8763E] font-medium">Kecocokan {idx + 1} / {info.matchPages.length}</span>
              <button disabled={!nextMatch} onClick={() => onPageChange(nextMatch)} className={`px-3 py-1.5 text-xs disabled:opacity-40 ${btnPrimary}`}>Kecocokan Berikutnya ▶</button>
            </div>
          );
        })()}
      </div>
    </Modal>
  );
}

        await fbDb.collection("public_directory").doc("advocate_emails").set({ [name]: email.trim() }, { merge: true }).catch((err) => console.error("Gagal sinkron direktori email:", err));
      }
      try { localStorage.setItem("tlf_advocate_name", name); } catch (_) {}
    } catch (err) {
      setError(
        err.code === "auth/email-already-in-use" ? "Email ini sudah pernah daftar. Silakan Masuk (Login)." :
        err.code === "auth/weak-password" ? "Kata sandi minimal 6 karakter." :
        err.code === "auth/invalid-email" ? "Format email tidak valid." :
        "Gagal mendaftar: " + err.message
      );
    }
    setBusy(false);
  };

  const handleResetPassword = async () => {
    setResetMsg(""); setResetBusy(true);
    const target = emailMap[name];
    if (!target) {
      setResetMsg("Email untuk nama ini belum tercatat di sistem. Kalau Anda belum pernah \"Daftar\" dengan email sungguhan (akun lama), minta admin hapus akun Anda dulu di Firebase Console, lalu daftar ulang memakai email.");
      setResetBusy(false);
      return;
    }
    try {
      await firebase.auth().sendPasswordResetEmail(target);
      setResetMsg("Link reset kata sandi sudah dikirim ke " + target + ". Cek juga folder Spam/Promosi kalau tidak muncul di kotak masuk.");
    } catch (err) {
      setResetMsg(err.code === "auth/user-not-found" ? "Email ini belum terdaftar di sistem login." : "Gagal mengirim: " + err.message);
    }
    setResetBusy(false);
  };

  return (
    <div className="min-h-screen bg-[#F7F4EC] flex items-center justify-center p-5" style={{ fontFamily: "Georgia, serif" }}>
      <div className="bg-white border border-[#D9CFB8] rounded-sm p-8 w-full max-w-sm sans">
        <div className="flex items-center gap-2 mb-6 justify-center">
          <IcoStamp size={24} className="text-[#A8763E]" />
          <div className="text-center">
            <div className="font-serif text-xl text-[#1B2A4A]" style={{ fontFamily: "Georgia, serif" }}>Trunojoyo</div>
            <div className="text-[10px] uppercase tracking-widest text-[#A8763E]">Law Firm — Sampang</div>
          </div>
        </div>

        <div className="flex mb-5 border border-[#D9CFB8] rounded-sm overflow-hidden">
          <button onClick={() => { setMode("login"); setError(""); setResetMsg(""); }} className={`flex-1 py-2 text-sm ${mode === "login" ? "bg-[#1B2A4A] text-white" : "bg-white text-[#6B6252]"}`}>Masuk</button>
          <button onClick={() => { setMode("register"); setError(""); setResetMsg(""); }} className={`flex-1 py-2 text-sm ${mode === "register" ? "bg-[#1B2A4A] text-white" : "bg-white text-[#6B6252]"}`}>Daftar</button>
        </div>

        <form onSubmit={mode === "login" ? handleLogin : handleRegister}>
          <Field label="Anda advokat yang mana?">
            <select value={name} onChange={(e) => setName(e.target.value)} className={inputCls}>
              {ADVOCATES.filter((a) => a !== "Anda").map((a) => <option key={a}>{a}</option>)}
            </select>
          </Field>
          {mode === "register" && (
            <Field label="Email Anda (sungguhan)"><input required type="email" value={email} onChange={(e) => setEmail(e.target.value)} className={inputCls} placeholder="mis. namaanda@gmail.com" /></Field>
          )}
          <Field label="Kata Sandi"><input required type="password" minLength={6} value={password} onChange={(e) => setPassword(e.target.value)} className={inputCls} placeholder="minimal 6 karakter" /></Field>
          {mode === "register" && (
            <Field label="Kode Pendaftaran Kantor"><input required type="password" value={regCode} onChange={(e) => setRegCode(e.target.value)} className={inputCls} placeholder="tanyakan ke rekan kantor Anda" /></Field>
          )}
          {error && <p className="text-xs text-[#7A2331] mb-3">{error}</p>}
          <button disabled={busy || (mode === "login" && !mapLoaded)} className={`w-full mt-1 disabled:opacity-50 ${btnPrimary}`}>{busy ? "Memproses…" : !mapLoaded && mode === "login" ? "Memuat…" : mode === "login" ? "Masuk" : "Daftar & Masuk"}</button>
        </form>
        {mode === "register" && (
          <p className="text-xs text-[#6B6252] mt-4 text-center">Email ini dipakai untuk login dan untuk menerima link reset kata sandi kalau lupa — pastikan email aktif dan hanya Anda yang bisa membukanya.</p>
        )}
        {mode === "login" && (
          <details className="mt-3 text-center">
            <summary className="text-xs text-[#A8763E] cursor-pointer hover:underline inline-block">Lupa kata sandi?</summary>
            <div className="text-xs text-[#6B6252] mt-2 text-left bg-[#F7F4EC] p-3 rounded-sm border border-[#D9CFB8]">
              <p className="mb-2">Klik tombol di bawah — link reset kata sandi akan dikirim ke email yang Anda daftarkan untuk nama <b>{name}</b> di atas.</p>
              <button type="button" disabled={resetBusy} onClick={handleResetPassword} className="w-full py-1.5 text-xs border border-[#A8763E] text-[#A8763E] rounded-sm hover:bg-[#A8763E] hover:text-white disabled:opacity-50">
                {resetBusy ? "Mengirim…" : "Kirim Link Reset Kata Sandi"}
              </button>
              {resetMsg && <p className="mt-2 text-[#1B2A4A]">{resetMsg}</p>}
            </div>
          </details>
        )}
      </div>
    </div>
  );
}

function App() {
  const [authUser, setAuthUser] = useState(undefined);
  useEffect(() => {
    if (!fbReady) { setAuthUser(null); return; }
    const unsub = firebase.auth().onAuthStateChanged((user) => setAuthUser(user || null));
    return () => unsub();
  }, []);
  // Nama advokat ditentukan dari localStorage (disimpan saat login/daftar di perangkat ini),
  // dengan fallback mencocokkan email login ke direktori publik (untuk perangkat/login baru).
  const [publicEmailMap, setPublicEmailMap] = useState({});
  useEffect(() => {
    if (authUser && fbDb) loadAdvocateEmailMap().then(setPublicEmailMap);
  }, [authUser]);

  const [clients, setClients] = useStore("clients", []);
  const [cases, setCases, cloudSynced] = useStore("cases", []);
  const [deadlines, setDeadlines] = useStore("deadlines", []);
  const [references, setReferences] = useStore("references", []);
  const [activities, setActivities] = useStore("activities", []);
  const [timeEntries, setTimeEntries] = useStore("timeEntries", []);
  const [ledger, setLedger] = useStore("ledger", []);
  const [advocateProfiles, setAdvocateProfiles] = useStore("advocateProfiles", {});
  const [stageTemplates, setStageTemplates] = useStore("stageTemplates", DEFAULT_STAGE_TEMPLATES);
  const [showStageSettings, setShowStageSettings] = useState(false);

  // Naik tahap otomatis: kalau (Tanggal Mulai Tahapan + Durasi Tahapan dari template) sudah lewat,
  // kasus otomatis pindah ke tahap berikutnya — bisa loncat lebih dari satu tahap sekaligus kalau
  // aplikasi lama tidak dibuka. Berhenti di tahap yang durasinya 0/kosong (berarti harus manual),
  // atau saat sudah sampai tahap terakhir.
  useEffect(() => {
    if (!authUser || !cases.length) return;
    const todayMs = new Date(todayISO()).getTime();
    let changed = false;
    const next = cases.map((c) => {
      let stageIdx = Math.max(0, STAGES.indexOf(c.stage || STAGES[0]));
      let stageStartDate = c.stageStartDate || (c.createdAt ? c.createdAt.slice(0, 10) : todayISO());
      let guard = 0;
      while (stageIdx < STAGES.length - 1 && guard < STAGES.length) {
        const dur = Number(stageTemplates[STAGES[stageIdx]]?.durationDays) || 0;
        if (dur <= 0) break;
        const dueMs = new Date(stageStartDate).getTime() + dur * 86400000;
        if (dueMs > todayMs) break;
        stageIdx += 1;
        stageStartDate = new Date(dueMs).toISOString().slice(0, 10);
        guard++;
      }
      const newStage = STAGES[stageIdx];
      if (newStage !== c.stage || stageStartDate !== c.stageStartDate) { changed = true; return { ...c, stage: newStage, stageStartDate }; }
      return c;
    });
    if (changed) setCases(next);
  }, [authUser, cases, stageTemplates]);

  const [tab, setTab] = useState("dashboard");
  const [showProfileForm, setShowProfileForm] = useState(false);
  const [editAdvocateName, setEditAdvocateName] = useState(ADVOCATES[0]);
  const [showMoreSheet, setShowMoreSheet] = useState(false);
  let storedName = null;
  try { storedName = localStorage.getItem("tlf_advocate_name"); } catch (_) {}
  const myAdvocateName = authUser
    ? ((storedName && ADVOCATES.includes(storedName) ? storedName : null)
        || ADVOCATES.filter((a) => a !== "Anda").find((a) => publicEmailMap[a] === authUser.email)
        || ADVOCATES.filter((a) => a !== "Anda").find((a) => nameToLoginEmail(a) === authUser.email) // fallback akun lama
        || null)
    : null;
  const activeAdvocate = myAdvocateName || ADVOCATES[0];
  const [showClientForm, setShowClientForm] = useState(false);
  const [showCaseForm, setShowCaseForm] = useState(false);
  const [editingClientId, setEditingClientId] = useState(null);
  const [editingCaseId, setEditingCaseId] = useState(null);
  const [editingReferenceId, setEditingReferenceId] = useState(null);
  const [editingActivityId, setEditingActivityId] = useState(null);
  const [editingTimeEntryId, setEditingTimeEntryId] = useState(null);
  const [editingLedgerId, setEditingLedgerId] = useState(null);
  const [showDeadlineForm, setShowDeadlineForm] = useState(false);
  const [editingDeadlineId, setEditingDeadlineId] = useState(null);
  const [showRefForm, setShowRefForm] = useState(false);
  const [showActForm, setShowActForm] = useState(false);
  const [showTimeForm, setShowTimeForm] = useState(false);
  const [showLedgerForm, setShowLedgerForm] = useState(false);
  const [conflictWarning, setConflictWarning] = useState(null);
  const [docCaseId, setDocCaseId] = useState("");
  const [docTemplate, setDocTemplate] = useState("sk");
  const [docActId, setDocActId] = useState("");
  const [search, setSearch] = useState("");
  const [signName, setSignName] = useState("");
  const [signAgree, setSignAgree] = useState(false);
  const [ledgerClientId, setLedgerClientId] = useState("");
  const [lawSearch, setLawSearch] = useState("");
  const [debouncedLawSearch, setDebouncedLawSearch] = useState("");
  const [refCategoryFilter, setRefCategoryFilter] = useState("");
  const [favoriteRefIds, setFavoriteRefIds] = useStore("favoriteRefIds", []);
  const [refSearchHistory, setRefSearchHistory] = useStore("refSearchHistory", []);

  useEffect(() => {
    const t = setTimeout(() => setDebouncedLawSearch(lawSearch), 300);
    return () => clearTimeout(t);
  }, [lawSearch]);

  const commitSearchHistory = (term) => {
    const trimmed = term.trim();
    if (!trimmed) return;
    setRefSearchHistory((prev) => [trimmed, ...prev.filter((h) => h.toLowerCase() !== trimmed.toLowerCase())].slice(0, 5));
  };

  const toggleFavoriteRef = (id) => {
    setFavoriteRefIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
  };

  const highlightMatch = (text, query) => {
    if (!query) return text;
    const idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx < 0) return text;
    return (
      <>
        {text.slice(0, idx)}
        <mark className="bg-[#F5D98B] text-[#1B2A4A] px-0.5 rounded-sm">{text.slice(idx, idx + query.length)}</mark>
        {text.slice(idx + query.length)}
      </>
    );
  };
  const [caseLegalAreaSel, setCaseLegalAreaSel] = useState(LEGAL_AREAS[0]);
  const [refContent, setRefContent] = useState("");
  const [refUploading, setRefUploading] = useState(false);
  const [refFileName, setRefFileName] = useState("");
  const [refPdfData, setRefPdfData] = useState(null);
  const [refPageTexts, setRefPageTexts] = useState([]);
  const [viewingPdf, setViewingPdf] = useState(null);
  const [copyToast, setCopyToast] = useState(false);

  const clientById = (id) => clients.find((c) => c.id === id) || {};
  const caseById = (id) => cases.find((c) => c.id === id) || {};
  const advocateInfo = (name) => ({ name, ...(ADVOCATE_DATA[name] || {}), ...(advocateProfiles[name] || {}) });

  const upcomingDeadlines = useMemo(() => [...deadlines].sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate)), [deadlines]);

  const workloadData = useMemo(
    () => ADVOCATES.map((a) => ({ name: a.split(",")[0], kasus: cases.filter((c) => c.advocateId === a && c.stage !== "Selesai").length })),
    [cases]
  );
  const stageData = useMemo(
    () => STAGES.map((s) => ({ name: s, kasus: cases.filter((c) => c.stage === s).length })),
    [cases]
  );

  const localRefMatches = useMemo(() => {
    const q = debouncedLawSearch.trim().toLowerCase();
    if (!q) return [];
    return references
      .filter((r) => !refCategoryFilter || r.category === refCategoryFilter)
      .map((r) => {
        const hay = `${r.title || ""} ${r.notes || ""} ${r.content || ""}`.toLowerCase();
        if (!hay.includes(q)) return null;
        let snippet = "";
        if (r.content) {
          const idx = r.content.toLowerCase().indexOf(q);
          if (idx >= 0) {
            const start = Math.max(0, idx - 80);
            const end = Math.min(r.content.length, idx + q.length + 200);
            snippet = (start > 0 ? "…" : "") + r.content.slice(start, end) + (end < r.content.length ? "…" : "");
          }
        }
        let matchPages = [];
        if (r.pageTexts?.length) {
          matchPages = r.pageTexts.map((pt, i) => (pt?.toLowerCase().includes(q) ? i + 1 : null)).filter(Boolean);
        }
        return { ...r, snippet, matchPages, matchPage: matchPages[0] || null, matchPageCount: matchPages.length, isFavorite: favoriteRefIds.includes(r.id) };
      })
      .filter(Boolean)
      .sort((a, b) => (b.isFavorite ? 1 : 0) - (a.isFavorite ? 1 : 0));
  }, [references, debouncedLawSearch, refCategoryFilter, favoriteRefIds]);

  const allLawMatchesIgnoringFilter = useMemo(() => {
    const q = debouncedLawSearch.trim().toLowerCase();
    if (!q) return 0;
    return references.filter((r) => `${r.title || ""} ${r.notes || ""} ${r.content || ""}`.toLowerCase().includes(q)).length;
  }, [references, debouncedLawSearch]);

  const caseLinkedRefs = useMemo(() => {
    if (!docCaseId || lawSearch.trim()) return [];
    return references.filter((r) => r.caseId === docCaseId);
  }, [references, docCaseId, lawSearch]);

  const relevantCases = useMemo(() => {
    const tpl = TEMPLATES[docTemplate];
    const scope = tpl?.courts || [];
    let pool = scope.length === 0 ? cases : cases.filter((c) => scope.includes(c.court));
    if (tpl?.familySubtype) pool = pool.filter((c) => c.familySubtype === tpl.familySubtype);
    const urgencyRank = { Mendesak: 0, Perhatian: 1, Normal: 2 };
    return [...pool].sort((a, b) => (urgencyRank[a.urgency] ?? 3) - (urgencyRank[b.urgency] ?? 3) || new Date(b.createdAt) - new Date(a.createdAt));
  }, [cases, docTemplate]);

  useEffect(() => {
    if (docTemplate === "undangan") return;
    if (!relevantCases.some((c) => c.id === docCaseId)) {
      setDocCaseId(relevantCases[0]?.id || "");
    }
  }, [docTemplate, relevantCases]);

  useEffect(() => {
    if (docTemplate === "undangan" && activities.length && !activities.some((a) => a.id === docActId)) {
      setDocActId(activities[0].id);
    }
  }, [docTemplate, activities]);

  const checkConflict = (name, opposing) => {
    const hit = cases.find(
      (c) =>
        (opposing && clientById(c.clientId).name?.toLowerCase() === opposing.toLowerCase()) ||
        (name && c.opposingParty?.toLowerCase() === name.toLowerCase())
    );
    return hit || null;
  };

  const addClient = (form) => {
    if (editingClientId) {
      setClients((prev) => prev.map((c) => (c.id === editingClientId ? { ...c, ...form, updatedBy: activeAdvocate, updatedAt: new Date().toISOString() } : c)));
      setEditingClientId(null);
    } else {
      setClients((prev) => [...prev, { id: uid(), ...form, createdBy: activeAdvocate, createdAt: new Date().toISOString() }]);
    }
    setShowClientForm(false);
  };
  const deleteClient = (id) => {
    if (cases.some((c) => c.clientId === id)) { window.alert("Klien ini masih dipakai di suatu kasus. Hapus/ubah kasusnya dulu sebelum menghapus klien."); return; }
    setClients((prev) => prev.filter((c) => c.id !== id));
  };

  const addCase = (form) => {
    if (editingCaseId) {
      setCases((prev) => prev.map((c) => {
        if (c.id !== editingCaseId) return c;
        // Kalau Tahapan diubah manual lewat form, hitung ulang Tanggal Mulai Tahapan dari sekarang
        // (kecuali user juga isi tanggal mulai secara eksplisit lewat field stageStartDate).
        const stageChangedManually = form.stage && form.stage !== c.stage;
        const stageStartDate = form.stageStartDate || (stageChangedManually ? todayISO() : c.stageStartDate);
        return { ...c, ...form, stageStartDate, updatedBy: activeAdvocate, updatedAt: new Date().toISOString() };
      }));
      setEditingCaseId(null);
      setShowCaseForm(false);
      return;
    }
    const conflict = checkConflict(clientById(form.clientId).name, form.opposingParty);
    if (conflict) { setConflictWarning({ conflict, form }); return; }
    setCases((prev) => [...prev, { id: uid(), createdAt: todayISO(), createdBy: activeAdvocate, stageStartDate: form.stageStartDate || todayISO(), ...form }]);
    setShowCaseForm(false);
  };
  const deleteCase = (id) => {
    const c = caseById(id);
    (c.attachments || []).forEach((a) => { if (fbStorage && a.path) fbStorage.ref(a.path).delete().catch(() => {}); });
    setCases((prev) => prev.filter((c) => c.id !== id));
  };

  const [attachmentBusy, setAttachmentBusy] = useState(null); // { caseId, name, progress }
  const uploadCaseAttachment = async (caseId, file) => {
    if (!file) return;
    if (file.type !== "application/pdf") { window.alert("Hanya file PDF yang didukung."); return; }
    if (!fbStorage) { window.alert("Firebase Storage belum aktif/terhubung. Aktifkan dulu di Firebase Console (lihat catatan pengaturan)."); return; }
    setAttachmentBusy({ caseId, name: file.name, progress: "Mengompres…" });
    try {
      const result = await compressPdfFile(file, (pageNum, total) => setAttachmentBusy({ caseId, name: file.name, progress: `Mengompres halaman ${pageNum}/${total}…` }));
      setAttachmentBusy({ caseId, name: file.name, progress: "Mengunggah…" });
      const path = `case-attachments/${caseId}/${uid()}-${file.name.replace(/[^a-zA-Z0-9._-]/g, "_")}`;
      const ref = fbStorage.ref(path);
      await ref.put(result.blob, { contentType: "application/pdf" });
      const url = await ref.getDownloadURL();
      const attachment = {
        id: uid(), name: file.name, path, url,
        size: result.finalSize, originalSize: result.originalSize, compressed: result.compressed,
        uploadedAt: new Date().toISOString(), uploadedBy: activeAdvocate,
      };
      setCases((prev) => prev.map((c) => (c.id === caseId ? { ...c, attachments: [...(c.attachments || []), attachment] } : c)));
    } catch (err) {
      console.error("Gagal unggah lampiran:", err);
      window.alert("Gagal mengunggah PDF: " + err.message);
    }
    setAttachmentBusy(null);
  };
  const deleteCaseAttachment = async (caseId, attachment) => {
    if (!window.confirm(`Hapus lampiran "${attachment.name}"?`)) return;
    if (fbStorage && attachment.path) { try { await fbStorage.ref(attachment.path).delete(); } catch (err) { console.error(err); } }
    setCases((prev) => prev.map((c) => (c.id === caseId ? { ...c, attachments: (c.attachments || []).filter((a) => a.id !== attachment.id) } : c)));
  };

  const exportBackup = () => {
    if (typeof XLSX === "undefined") { window.alert("Pembuat file Excel belum siap dimuat. Coba lagi sesaat lagi."); return; }
    const wb = XLSX.utils.book_new();
    const addSheet = (name, rows) => {
      const ws = XLSX.utils.json_to_sheet(rows.length ? rows : [{}]);
      XLSX.utils.book_append_sheet(wb, ws, name.slice(0, 31));
    };
    addSheet("Klien", clients.map((c) => ({
      Nama: c.name, NIK: c.nik, "Tempat Lahir": c.birthPlace, "Tanggal Lahir": c.birthDate, "Jenis Kelamin": c.gender,
      Agama: c.religion, Pendidikan: c.education, Pekerjaan: c.occupation, Alamat: c.address, "No. HP": c.phone, Email: c.email,
      "Dibuat Oleh": c.createdBy, "Dibuat Tanggal": c.createdAt,
    })));
    addSheet("Kasus", cases.map((c) => ({
      "No. Perkara": c.caseNumber, Klien: clientById(c.clientId).name, "Pihak Lawan": c.opposingParty,
      Pengadilan: c.court, Kota: c.courtCity, "Bidang Hukum": c.legalArea, Subtipe: c.familySubtype,
      Tahap: c.stage, Urgensi: c.urgency, "Advokat Utama": c.advocateId, "Advokat Pembantu": (c.coAdvocates || []).join(", "),
      "Dibuat Oleh": c.createdBy, "Dibuat Tanggal": c.createdAt, "Diubah Oleh": c.updatedBy, "Diubah Tanggal": c.updatedAt,
    })));
    addSheet("Tenggat", deadlines.map((d) => ({
      Judul: d.title, "Jatuh Tempo": d.dueDate, Kasus: caseById(d.caseId).caseNumber || "Umum",
    })));
    addSheet("Referensi Hukum", references.map((r) => ({
      Judul: r.title, Kategori: r.category, Tautan: r.url, Catatan: r.notes, Kasus: caseById(r.caseId).caseNumber || "-",
    })));
    addSheet("Kegiatan", activities.map((a) => ({
      Judul: a.title, Jenis: a.type, Tanggal: a.date, Lokasi: a.location,
    })));
    addSheet("Catatan Waktu", timeEntries.map((t) => ({
      Kasus: caseById(t.caseId).caseNumber || "-", Deskripsi: t.description, Tanggal: t.date, Jam: t.hours, "Tarif/Jam": t.rate, Total: t.hours * t.rate,
    })));
    addSheet("Dana Klien", ledger.map((l) => ({
      Klien: clientById(l.clientId).name, Jenis: l.type, Jumlah: l.amount, Keterangan: l.note, Tanggal: l.date,
    })));
    XLSX.writeFile(wb, `Trunojoyo-Backup-${todayISO()}.xlsx`);
  };
  const confirmDespiteConflict = () => {
    setCases((prev) => [...prev, { id: uid(), createdAt: todayISO(), createdBy: activeAdvocate, ...conflictWarning.form }]);
    setConflictWarning(null); setShowCaseForm(false);
  };

  const addDeadline = (form) => {
    if (editingDeadlineId) {
      setDeadlines((prev) => prev.map((d) => (d.id === editingDeadlineId ? { ...d, ...form } : d)));
      setEditingDeadlineId(null);
    } else {
      setDeadlines((prev) => [...prev, { id: uid(), ...form }]);
    }
    setShowDeadlineForm(false);
  };
  const addReference = (form) => {
    if (editingReferenceId) {
      setReferences((prev) => prev.map((r) => (r.id === editingReferenceId ? { ...r, ...form } : r)));
      setEditingReferenceId(null);
    } else {
      setReferences((prev) => [...prev, { id: uid(), ...form }]);
    }
    setShowRefForm(false); setRefContent(""); setRefFileName("");
  };
  const handleRefFileUpload = async (file) => {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith(".pdf")) {
      window.alert("Hanya file PDF yang bisa diupload. Silakan pilih file berformat .pdf.");
      return;
    }
    setRefUploading(true);
    setRefFileName(file.name);
    try {
      const pdfjsLibLoaded = await loadPdfJs();
      const buf = await file.arrayBuffer();
      const bytes = new Uint8Array(buf);
      let binary = "";
      for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
      const base64Pdf = btoa(binary);
      if (base64Pdf.length > 700000) {
        setRefPdfData(null);
        window.alert("File PDF ini terlalu besar untuk disimpan online (maks. sekitar 500KB). Isi teksnya tetap akan diekstrak dan bisa dicari, tapi tampilan halaman asli tidak akan tersedia untuk file ini.");
      } else {
        setRefPdfData(base64Pdf);
      }
      const pdf = await pdfjsLibLoaded.getDocument({ data: buf }).promise;
      let fullText = "";
      const pageTexts = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        let lastY = null;
        let pageLines = [];
        let currentLine = "";
        content.items.forEach((item) => {
          const y = Math.round(item.transform[5]);
          if (lastY !== null && Math.abs(y - lastY) > 2) {
            pageLines.push(currentLine.trim());
            currentLine = item.str;
          } else {
            currentLine += (currentLine ? " " : "") + item.str;
          }
          lastY = y;
        });
        if (currentLine.trim()) pageLines.push(currentLine.trim());
        let paragraphs = [];
        let buffer = "";
        pageLines.forEach((line) => {
          if (!line) { if (buffer) { paragraphs.push(buffer); buffer = ""; } return; }
          buffer += (buffer ? " " : "") + line;
          if (/[.;:]\s*$/.test(line)) { paragraphs.push(buffer); buffer = ""; }
        });
        if (buffer) paragraphs.push(buffer);
        const pageJoined = paragraphs.join("\n\n");
        pageTexts.push(pageJoined);
        fullText += pageJoined + "\n\n";
      }
      setRefPageTexts(pageTexts);
      setRefContent(fullText.trim());
    } catch (err) {
      setRefContent("(Gagal membaca file PDF. Coba salin-tempel isi teksnya secara manual — mungkin ini PDF hasil scan/gambar yang tidak memiliki teks.)");
    }

                              spacing: { after: 120 },

                        const lines = cleanText.split("\n");

                        lines.forEach((line, i) => {
                          if (i > 0) runs.push(new TextRun({ text: line, break: 1 }));
                          else runs.push(new TextRun({ text: line }));

                          children: runs,

                        const leftCellChildren = [
                          new Paragraph({ alignment: AlignmentType.CENTER, spacing: { line: 360, lineRule: "auto" }, children: [new TextRun({ text: "PENERIMA KUASA,", bold: true })] }),
                          new Paragraph({ spacing: { after: 300, line: 360, lineRule: "auto" }, alignment: AlignmentType.JUSTIFIED, children: [] }),
                          ...advRows.flatMap((a, i) => [
                            ...(i > 0 ? [new Paragraph({ indent: { left: 720 }, spacing: { after: 100, line: 360, lineRule: "auto" }, children: [] })] : []),

                        const rightCellChildren = [

                <Field label="Sebab Perselisihan"><textarea name="disputeCause" defaultValue={ec?.disputeCause} rows={2} className={inputCls} placeholder="mis. kondisi ekonomi tidak stabil, sering bertengkar..." /></Field>
                <Field label="Kondisi Perpisahan"><textarea name="separationInfo" defaultValue={ec?.separationInfo} rows={2} className={inputCls} placeholder="mis. sejak Juli 2025 berpisah tempat tinggal selama 1 tahun" /></Field>

                <p className="text-xs uppercase tracking-wider text-[#A8763E] mb-2 mt-4">Khusus Perubahan Nama pada Buku Nikah</p>
                <Field label="Nama Siapa yang Dikoreksi"><select name="correctionSubject" defaultValue={ec?.correctionSubject} className={inputCls}>{CORRECTION_SUBJECTS.map((s) => <option key={s}>{s}</option>)}</select></Field>
                <div className="grid grid-cols-2 gap-3">
                  <Field label="Nama Lama (tertulis di Buku Nikah)"><input name="correctionOldName" defaultValue={ec?.correctionOldName} className={inputCls} /></Field>
                  <Field label="Nama Benar (sesuai KTP/KK)"><input name="correctionNewName" defaultValue={ec?.correctionNewName} className={inputCls} /></Field>
                </div>
                <Field label="Sebab Perbedaan Nama"><textarea name="correctionReason" defaultValue={ec?.correctionReason} rows={2} className={inputCls} placeholder="mis. kesalahan pencatatan petugas KUA saat pernikahan" /></Field>
              </div>
            )}

            {clients.length === 0 && <p className="text-xs text-[#7A2331] mb-2">Tambahkan klien terlebih dahulu.</p>}
            <button disabled={clients.length === 0} className={`w-full mt-2 disabled:opacity-40 ${btnPrimary}`}>{ec ? "Simpan Perubahan" : "Simpan Kasus"}</button>
          </form>

          {ec && (
            <div className="border-t border-[#D9CFB8] mt-4 pt-4 sans">
              <p className="text-xs uppercase tracking-wider text-[#A8763E] mb-2">Lampiran PDF (opsional)</p>
              <p className="text-xs text-[#6B6252] mb-3">
                File PDF otomatis dikompres saat diunggah supaya tidak berat (halaman di-render ulang ke resolusi sedang).
                Catatan: PDF hasil kompresi jadi berupa gambar per halaman — teksnya tidak bisa lagi di-select/dicari, cuma bisa dibaca/dicetak.
                Kalau kompresi tidak berhasil memperkecil ukuran (mis. PDF teks murni yang sudah ringkas), file asli dipakai apa adanya.
              </p>
              {(ec.attachments || []).length === 0 && <p className="text-xs text-[#6B6252] mb-2">Belum ada lampiran.</p>}
              <div className="divide-y divide-[#EDE7D9] border border-[#D9CFB8] rounded-sm mb-3">
                {(ec.attachments || []).map((a) => (
                  <div key={a.id} className="p-3 flex items-center justify-between text-sm">
                    <div className="min-w-0">
                      <a href={a.url} target="_blank" rel="noopener noreferrer" className="text-[#1B2A4A] hover:underline truncate block">{a.name}</a>
                      <div className="text-xs text-[#6B6252]">
                        {fmtBytes(a.size)}{a.compressed && a.originalSize > a.size ? ` (dari ${fmtBytes(a.originalSize)}, hemat ${Math.round((1 - a.size / a.originalSize) * 100)}%)` : ""} · {fmtDate(a.uploadedAt)} · {a.uploadedBy}
                      </div>
                    </div>
                    <button type="button" onClick={() => deleteCaseAttachment(ec.id, a)} className="text-[#6B6252] hover:text-[#7A2331] shrink-0 ml-2" aria-label="Hapus lampiran"><IcoTrash size={14} /></button>
                  </div>
                ))}
              </div>
              {attachmentBusy && attachmentBusy.caseId === ec.id ? (
                <p className="text-xs text-[#A8763E]">{attachmentBusy.name} — {attachmentBusy.progress}</p>
              ) : (
                <label className="flex items-center justify-center gap-1.5 px-3 py-2 text-sm border border-dashed border-[#A8763E] text-[#A8763E] rounded-sm cursor-pointer hover:bg-[#FEF3E2]">
                  <IcoUpload size={14} /> Unggah PDF
                  <input type="file" accept="application/pdf" className="hidden" onChange={(e) => { const f = e.target.files[0]; e.target.value = ""; if (f) uploadCaseAttachment(ec.id, f); }} />
                </label>
              )}
            </div>
          )}
        </Modal>
        );
      })()}

      {conflictWarning && (
        <Modal title="Potensi Konflik Kepentingan" onClose={() => setConflictWarning(null)}>
          <div className="sans text-sm">
            <div className="flex items-start gap-2 bg-[#F7ECEC] border border-[#7A2331]/30 rounded-sm p-3 mb-4">
              <IcoWarn size={18} className="text-[#7A2331] flex-shrink-0 mt-0.5" />
              <p className="text-[#5C1A24]">Nama yang tercatat di kasus ini juga muncul pada perkara <span className="mono font-semibold">{conflictWarning.conflict.caseNumber}</span>, kemungkinan sebagai pihak berbeda. Periksa dahulu sebelum melanjutkan.</p>
            </div>
            <div className="flex gap-2">
              <button onClick={() => setConflictWarning(null)} className={`flex-1 ${btnOutline}`}>Batalkan</button>
              <button onClick={confirmDespiteConflict} className="flex-1 bg-[#7A2331] text-white py-2 rounded-sm text-sm hover:bg-[#651c27]">Lanjutkan Tetap</button>
            </div>
          </div>
        </Modal>
      )}

      {showDeadlineForm && (() => {
        const ed = editingDeadlineId ? deadlines.find((d) => d.id === editingDeadlineId) : null;
        return (
        <Modal title={ed ? "Edit Tenggat" : "Tenggat Baru"} onClose={() => { setShowDeadlineForm(false); setEditingDeadlineId(null); }}>
          <form className="sans" onSubmit={(e) => { e.preventDefault(); const f = new FormData(e.target); addDeadline({ title: f.get("title"), dueDate: f.get("dueDate"), caseId: f.get("caseId") }); }}>
            <Field label="Judul Tenggat"><input required name="title" defaultValue={ed?.title} className={inputCls} placeholder="mis. Batas keberatan administratif" /></Field>
            <Field label="Tanggal"><input required type="date" name="dueDate" defaultValue={ed?.dueDate} className={inputCls} /></Field>
            <Field label="Kaitkan dengan Kasus (opsional)"><select name="caseId" defaultValue={ed?.caseId} className={inputCls}><option value="">— umum —</option>{cases.map((c) => <option key={c.id} value={c.id}>{c.caseNumber}</option>)}</select></Field>
            <button className={`w-full mt-2 ${btnPrimary}`}>{ed ? "Simpan Perubahan" : "Simpan Tenggat"}</button>
          </form>
        </Modal>
        );
      })()}

      {showRefForm && (() => {
        const er = editingReferenceId ? references.find((r) => r.id === editingReferenceId) : null;
        return (
        <Modal title={er ? "Edit Referensi" : "Referensi Hukum Baru"} onClose={() => { setShowRefForm(false); setEditingReferenceId(null); setRefContent(""); setRefFileName(""); }}>
          <form className="sans" onSubmit={(e) => { e.preventDefault(); const f = new FormData(e.target); addReference({ title: f.get("title"), category: f.get("category"), url: f.get("url"), notes: f.get("notes"), caseId: f.get("caseId"), content: refContent, pdfData: refPdfData || er?.pdfData, pageTexts: refPageTexts.length ? refPageTexts : (er?.pageTexts || []) }); setRefPdfData(null); setRefPageTexts([]); }}>
            <Field label="Judul/Nomor Peraturan"><input required name="title" defaultValue={er?.title} className={inputCls} placeholder="mis. SEMA No. 3 Tahun 2023" /></Field>
            <Field label="Kategori"><select name="category" defaultValue={er?.category} className={inputCls}>{REF_CATEGORIES.map((c) => <option key={c}>{c}</option>)}</select></Field>
            <Field label="Tautan Sumber Resmi"><input name="url" defaultValue={er?.url} className={inputCls} placeholder="https://peraturan.bpk.go.id/…" /></Field>
            <Field label="Catatan Analisis"><textarea name="notes" defaultValue={er?.notes} rows={3} className={inputCls} /></Field>
            <Field label="Kaitkan dengan Kasus (opsional)"><select name="caseId" defaultValue={er?.caseId} className={inputCls}><option value="">—</option>{cases.map((c) => <option key={c.id} value={c.id}>{c.caseNumber}</option>)}</select></Field>

            <div className="border-t border-[#D9CFB8] my-3 pt-3">
              <p className="text-xs uppercase tracking-wider text-[#A8763E] mb-2">Isi Lengkap Pasal/Peraturan (opsional)</p>
              <label className="flex items-center justify-center gap-2 px-3 py-3 border-2 border-dashed border-[#D9CFB8] rounded-sm cursor-pointer hover:border-[#A8763E] text-sm text-[#6B6252] mb-3">
                <IcoUpload size={16} />
                {refUploading ? "Membaca file…" : refFileName ? `Terunggah: ${refFileName}` : er?.pdfData ? "Upload ulang file PDF (opsional)" : "Upload file PDF"}
                <input type="file" accept=".pdf" className="hidden" onChange={(e) => handleRefFileUpload(e.target.files?.[0])} />
              </label>
              <Field label="atau tempel/edit teks manual di sini">
                <textarea value={refContent} onChange={(e) => setRefContent(e.target.value)} rows={5} className={inputCls} placeholder="Tempel isi lengkap pasal/peraturan di sini…" />
              </Field>
              <p className="text-xs text-[#6B6252]">Isi ini yang membuat pencarian di kotak "Cari Pasal" bisa langsung menampilkan cuplikan pasalnya, tanpa perlu buka situs lain lagi.</p>
            </div>

            <button className={`w-full mt-2 ${btnPrimary}`}>{er ? "Simpan Perubahan" : "Simpan Referensi"}</button>
          </form>
        </Modal>
        );
      })()}

      {showActForm && (() => {
        const ea = editingActivityId ? activities.find((a) => a.id === editingActivityId) : null;
        return (
        <Modal title={ea ? "Edit Kegiatan" : "Kegiatan Baru"} onClose={() => { setShowActForm(false); setEditingActivityId(null); }}>
          <form className="sans" onSubmit={(e) => { e.preventDefault(); const f = new FormData(e.target); addActivity({ title: f.get("title"), type: f.get("type"), date: f.get("date"), location: f.get("location") }); }}>
            <Field label="Nama Kegiatan"><input required name="title" defaultValue={ea?.title} className={inputCls} placeholder="mis. Sampang Kabupaten Ramah Anak" /></Field>
            <Field label="Jenis"><select name="type" defaultValue={ea?.type} className={inputCls}>{ACTIVITY_TYPES.map((t) => <option key={t}>{t}</option>)}</select></Field>
            <Field label="Tanggal"><input required type="date" name="date" defaultValue={ea?.date} className={inputCls} /></Field>
            <Field label="Lokasi"><input name="location" defaultValue={ea?.location} className={inputCls} /></Field>
            <button className={`w-full mt-2 ${btnPrimary}`}>{ea ? "Simpan Perubahan" : "Simpan Kegiatan"}</button>
          </form>
        </Modal>
        );
      })()}

      {showTimeForm && (() => {
        const et = editingTimeEntryId ? timeEntries.find((t) => t.id === editingTimeEntryId) : null;
        return (
        <Modal title={et ? "Edit Catatan Waktu" : "Catatan Waktu Kerja"} onClose={() => { setShowTimeForm(false); setEditingTimeEntryId(null); }}>
          <form className="sans" onSubmit={(e) => { e.preventDefault(); const f = new FormData(e.target); addTimeEntry({ caseId: f.get("caseId"), description: f.get("description"), hours: Number(f.get("hours")), rate: Number(f.get("rate")), date: et?.date || todayISO() }); }}>
            <Field label="Kasus"><select required name="caseId" defaultValue={et?.caseId} className={inputCls}><option value="">— pilih kasus —</option>{cases.map((c) => <option key={c.id} value={c.id}>{c.caseNumber}</option>)}</select></Field>
            <Field label="Deskripsi Pekerjaan"><input required name="description" defaultValue={et?.description} className={inputCls} placeholder="mis. Penyusunan gugatan" /></Field>
            <Field label="Jumlah Jam"><input required type="number" step="0.5" name="hours" defaultValue={et?.hours} className={inputCls} /></Field>
            <Field label="Tarif per Jam (Rp)"><input required type="number" name="rate" defaultValue={et?.rate} className={inputCls} /></Field>
            <button className={`w-full mt-2 ${btnPrimary}`}>{et ? "Simpan Perubahan" : "Simpan"}</button>
          </form>
        </Modal>
        );
      })()}

      {showProfileForm && (
        <Modal title="Kelola Kontak & Email Advokat" onClose={() => setShowProfileForm(false)}>
          <form className="sans" onSubmit={(e) => {
            e.preventDefault(); const f = new FormData(e.target);
            const name = f.get("advocateName");
            const newEmail = f.get("email");
            setAdvocateProfiles((prev) => ({ ...prev, [name]: { birth: f.get("birth"), address: f.get("address"), noAdvokat: f.get("noAdvokat"), email: newEmail } }));
            if (fbDb && newEmail) {
              fbDb.collection("public_directory").doc("advocate_emails").set({ [name]: newEmail }, { merge: true }).catch((err) => console.error("Gagal sinkron direktori email:", err));
            }
            setShowProfileForm(false);
          }}>
            <Field label="Pilih Advokat">
              <select name="advocateName" className={inputCls} value={editAdvocateName} onChange={(e) => setEditAdvocateName(e.target.value)}>
                {ADVOCATES.map((a) => <option key={a} value={a}>{a}</option>)}
              </select>
            </Field>
            <Field label="Alamat Elektronik (Email) — khusus advokat ini">
              <input type="email" name="email" defaultValue={advocateInfo(editAdvocateName).email} className={inputCls} placeholder="mis. namaadvokat@gmail.com" />
            </Field>
            <Field label="Tempat, Tanggal Lahir"><input name="birth" defaultValue={advocateInfo(editAdvocateName).birth} className={inputCls} placeholder="mis. Sampang, 01-01-1999" /></Field>
            <Field label="Alamat Pribadi"><textarea name="address" defaultValue={advocateInfo(editAdvocateName).address} rows={2} className={inputCls} /></Field>
            <Field label="Nomor Induk Advokat"><input name="noAdvokat" defaultValue={advocateInfo(editAdvocateName).noAdvokat} className={inputCls} /></Field>
            <p className="text-xs text-[#6B6252] mb-2">Setiap advokat punya email masing-masing yang tersimpan terpisah. Alamat kantor (Trunojoyo Law Firm) tetap sama untuk semua dan tidak perlu diisi di sini.</p>
            <button className={`w-full mt-2 ${btnPrimary}`}>Simpan Kontak</button>
          </form>
        </Modal>
      )}

      {showStageSettings && (
        <Modal title="Atur Jadwal Tahapan" onClose={() => setShowStageSettings(false)}>
          <form className="sans" onSubmit={(e) => {
            e.preventDefault();
            const f = new FormData(e.target);
            setStageTemplates((prev) => {
              const next = { ...prev };
              STAGES.forEach((s) => {
                next[s] = { ...(next[s] || {}), durationDays: Number(f.get(`dur_${s}`)) || 0 };
              });
              return next;
            });
            setShowStageSettings(false);
          }}>
            <p className="text-xs text-[#6B6252] mb-3">
              Atur berapa hari tiap tahapan biasanya berlangsung. Kalau tanggal "Mulai Tahapan" + durasi ini sudah lewat,
              kasus otomatis pindah ke tahap berikutnya — bisa loncat lebih dari satu tahap kalau aplikasi lama tidak dibuka.
              Isi <b>0 (kosong)</b> untuk tahap yang tidak ingin naik otomatis (harus diubah manual di form kasus).
            </p>
            {STAGES.map((s, i) => (
              <div key={s} className="flex items-center gap-3 mb-2">
                <div className="w-32 text-sm text-[#1B2A4A] shrink-0">{i + 1}. {s}</div>
                <input type="number" min="0" name={`dur_${s}`} defaultValue={stageTemplates[s]?.durationDays || ""} placeholder="0 = manual" className={inputCls + " flex-1"} />
                <span className="text-xs text-[#6B6252] w-10 shrink-0">hari</span>
              </div>
            ))}
            <button className={`w-full mt-3 ${btnPrimary}`}>Simpan Jadwal Tahapan</button>
          </form>
        </Modal>
      )}

      {showLedgerForm && (() => {
        const el = editingLedgerId ? ledger.find((l) => l.id === editingLedgerId) : null;
        return (
        <Modal title={el ? "Edit Catatan Dana Klien" : "Catatan Dana Klien"} onClose={() => { setShowLedgerForm(false); setEditingLedgerId(null); }}>
          <form className="sans" onSubmit={(e) => { e.preventDefault(); const f = new FormData(e.target); addLedgerEntry({ clientId: f.get("clientId"), type: f.get("type"), amount: Number(f.get("amount")), note: f.get("note"), date: el?.date || todayISO() }); }}>
            <Field label="Klien"><select required name="clientId" defaultValue={el?.clientId} className={inputCls}><option value="">— pilih klien —</option>{clients.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}</select></Field>
            <Field label="Jenis"><select name="type" defaultValue={el?.type} className={inputCls}><option>Setoran</option><option>Pengeluaran</option></select></Field>
            <Field label="Jumlah (Rp)"><input required type="number" name="amount" defaultValue={el?.amount} className={inputCls} /></Field>
            <Field label="Keterangan"><input name="note" defaultValue={el?.note} className={inputCls} placeholder="mis. Biaya pendaftaran perkara" /></Field>
            <button className={`w-full mt-2 ${btnPrimary}`}>{el ? "Simpan Perubahan" : "Simpan"}</button>
          </form>
        </Modal>
        );
      })()}

      {copyToast && (
        <div className="fixed bottom-5 left-1/2 -translate-x-1/2 bg-[#1B2A4A] text-white text-sm px-4 py-2 rounded-sm shadow-lg sans z-50">
          Teks disalin ke clipboard
        </div>
      )}

      {viewingPdf && (
        <PdfViewerModal
          info={viewingPdf}
          onClose={() => setViewingPdf(null)}
          onPageChange={(p) => setViewingPdf((prev) => ({ ...prev, page: p }))}
        />
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
